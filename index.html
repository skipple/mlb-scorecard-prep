<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scorecard Prep</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
  <link rel="shortcut icon" href="assets/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Scorecard Prep">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <link rel="preconnect" href="https://statsapi.mlb.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <nav class="no-print">
    <a href="#" id="home-link">Today's games</a>
    <div class="nav-controls">
      <span id="nav-extra"></span>
      <a href="#" id="theme-toggle">Dark mode</a>
      <a href="#" id="print" onclick="window.print(); return false;">Print</a>
    </div>
  </nav>
  <main id="app">Loading...</main>
  <footer class="no-print">
    <p id="stats-note"></p>
    <p class="footer-row">
      <span>Data: MLB Stats API.<br>Field outlines: Baseball Savant.<br>Copyright MLB Advanced Media, L.P.</span>
      <span class="footer-links">
        <a href="#" data-modal="about">About</a><br>
        <a href="https://github.com/skipple/mlb-scorecard-prep/issues/new">Report an issue</a>
      </span>
    </p>
  </footer>
  <!-- Shared modal shell. A link with data-modal="<name>" loads modals/<name>.html into it. -->
  <dialog id="modal" class="modal no-print" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
